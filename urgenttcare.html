<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PawPal Urgent Care</title>
    <style>
        :root {
            --bg: #f6f7f7;
            --card: #fff;
            --ink: #16162a;
            --muted: #8f929c;
            --line: #e4e6ea;
            --green: #19b183;
            --deep: #1c3d38;
            --coral: #ea6249;
            --sel: #e3f7ef;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #121418;
                --card: #1c1f26;
                --ink: #f1f1f5;
                --muted: #8d90a0;
                --line: #2c303a;
                --sel: #173a31
            }
        }

        :root[data-theme="dark"] {
            --bg: #121418;
            --card: #1c1f26;
            --ink: #f1f1f5;
            --muted: #8d90a0;
            --line: #2c303a;
            --sel: #173a31
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html,
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 0 18px 160px
        }

        .bar {
            display: flex;
            gap: 6px;
            padding-top: 18px
        }

        .bar i {
            flex: 1;
            height: 4px;
            border-radius: 4px;
            background: var(--line)
        }

        .bar i.done {
            background: var(--green)
        }

        .bar i.cur {
            background: linear-gradient(90deg, var(--green) 55%, var(--line) 55%)
        }

        .brand {
            font-weight: 700;
            font-size: 14px;
            margin-top: 14px
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-top: 22px
        }

        h1 {
            font-size: 28px;
            line-height: 1.15;
            font-weight: 800;
            letter-spacing: -.5px
        }

        .badge {
            flex: none;
            background: var(--coral);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            border-radius: 99px;
            padding: 6px 12px;
            margin-top: 6px;
            animation: pulse 2.4s ease-out 1
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(234, 98, 73, .5)
            }

            100% {
                box-shadow: 0 0 0 12px rgba(234, 98, 73, 0)
            }
        }

        .sub {
            font-size: 14px;
            color: var(--muted);
            margin-top: 8px
        }

        .step {
            display: inline-block;
            margin-top: 10px;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 99px;
            padding: 6px 12px
        }

        .pet {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card);
            border-radius: 18px;
            padding: 12px 14px;
            margin: 30px -4px 0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .07)
        }

        .av {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--green);
            color: #fff;
            font-weight: 700;
            display: grid;
            place-items: center
        }

        .pet div {
            flex: 1
        }

        .pet b {
            display: block;
            font-size: 15px
        }

        .pet small {
            font-size: 12px;
            color: var(--muted)
        }

        .pet svg.ck {
            stroke: var(--green)
        }

        h2 {
            font-size: 21px;
            font-weight: 800;
            margin-top: 42px;
            letter-spacing: -.3px
        }

        .hint {
            font-size: 13px;
            color: var(--muted);
            margin-top: 8px
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 10px;
            margin-top: 20px
        }

        .opt {
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
            font: inherit;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--ink);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 13px 12px;
            min-height: 46px;
            cursor: pointer;
            transition: transform .12s, border-color .15s, background .15s, box-shadow .15s
        }

        .opt svg {
            flex: none;
            width: 17px;
            height: 17px;
            color: var(--muted)
        }

        .opt:hover {
            border-color: var(--green)
        }

        .opt:active {
            transform: scale(.97)
        }

        .opt[aria-pressed="true"] {
            background: var(--sel);
            border: 1.5px solid var(--green);
            color: var(--green);
            box-shadow: 0 4px 12px rgba(25, 177, 131, .2)
        }

        .opt[aria-pressed="true"] svg {
            color: var(--green)
        }

        .opt:focus-visible,
        .go:focus-visible,
        .tab:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 2px
        }

        .why {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            background: var(--deep);
            color: #fff;
            border-radius: 16px;
            padding: 16px;
            margin-top: 34px
        }

        .why .sh {
            flex: none;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .12);
            display: grid;
            place-items: center;
            color: #7be0be
        }

        .why small {
            display: block;
            font-size: 12px;
            color: #7be0be;
            margin-bottom: 4px
        }

        .why p {
            font-size: 14px;
            line-height: 1.4
        }

        .cta {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            bottom: calc(66px + env(safe-area-inset-bottom, 0px));
            padding: 24px 18px 10px;
            background: linear-gradient(transparent, var(--bg) 40%)
        }

        .go {
            width: 100%;
            border: 0;
            font: inherit;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            background: var(--green);
            border-radius: 99px;
            padding: 17px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(25, 177, 131, .3);
            transition: transform .12s, opacity .2s
        }

        .go:active {
            transform: scale(.98)
        }

        .go[disabled] {
            opacity: .45;
            box-shadow: none;
            cursor: not-allowed
        }

        .go svg {
            width: 18px;
            height: 18px
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: var(--card);
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px))
        }

        .tab {
            background: none;
            border: 0;
            font: inherit;
            font-size: 10px;
            font-weight: 500;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 2px 14px;
            cursor: pointer
        }

        .tab.on {
            color: var(--green)
        }

        svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <div class="bar" aria-hidden="true"><i class="done"></i><i class="cur"></i><i></i><i></i><i></i><i></i></div>
        <div class="brand">pawpal</div>

        <div class="head">
            <h1>Let's make this safe</h1>
            <span class="badge">STEP 2/6</span>
        </div>
        <p class="sub">Tell PawPal the urgent concern.</p>
        <span class="step">STEP 1 · PB1</span>

        <div class="pet">
            <div class="av">M</div>
            <div><b>Milo</b><small>Golden Retriever • 3 yrs</small></div>
            <svg class="ck" viewBox="0 0 24 24">
                <path d="M20 6L9 17l-5-5" />
            </svg>
        </div>

        <h2>What happened?</h2>
        <p class="hint">Choose the closest match.</p>

        <div class="grid" id="grid">
            <button class="opt" aria-pressed="true"><svg viewBox="0 0 24 24">
                    <path
                        d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01" />
                </svg>Ate something harmful</button>
            <button class="opt" aria-pressed="false"><svg viewBox="0 0 24 24">
                    <path d="M3 8h9a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h6" />
                </svg>Breathing trouble</button>
            <button class="opt" aria-pressed="false"><svg viewBox="0 0 24 24">
                    <path d="M3 12h4l3-8 4 16 3-8h4" />
                </svg>Injury</button>
            <button class="opt" aria-pressed="false"><svg viewBox="0 0 24 24">
                    <path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z" />
                </svg>Vomiting</button>
            <button class="opt" aria-pressed="false"><svg viewBox="0 0 24 24">
                    <path d="M13 2L4 14h7l-1 8 9-12h-7z" />
                </svg>Seizure</button>
            <button class="opt" aria-pressed="false"><svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M15 9l-6 6M9 9l6 6" />
                </svg>Not eating</button>
        </div>

        <div class="why">
            <div class="sh"><svg viewBox="0 0 24 24">
                    <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" />
                    <path d="M9 12l2 2 4-4" />
                </svg></div>
            <div><small>Why this helps</small>
                <p>We'll match you with clinics ready for this kind of urgent care.</p>
            </div>
        </div>
    </main>

    <div class="cta">
        <button class="go" id="go"><span id="lbl">Continue</span><svg viewBox="0 0 24 24">
                <path d="M5 12h14M13 6l6 6-6 6" />
            </svg></button>
    </div>

    <nav aria-label="Main">
        <button class="tab"><svg viewBox="0 0 24 24">
                <path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" />
            </svg>Home</button>
        <button class="tab on"><svg viewBox="0 0 24 24">
                <path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z" />
            </svg>Care</button>
        <button class="tab"><svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path d="M16 2v4M8 2v4M3 10h18" />
            </svg>Visits</button>
        <button class="tab"><svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
            </svg>Profile</button>
    </nav>

    <script>
        var opts = document.querySelectorAll('.opt'), go = document.getElementById('go'), lbl = document.getElementById('lbl');
        opts.forEach(function (b) {
            b.addEventListener('click', function () {
                var on = b.getAttribute('aria-pressed') === 'true';
                opts.forEach(function (o) { o.setAttribute('aria-pressed', 'false') });
                if (!on) { b.setAttribute('aria-pressed', 'true') }
                var sel = document.querySelector('.opt[aria-pressed="true"]');
                go.disabled = !sel;
                lbl.textContent = sel ? 'Continue' : 'Choose a match';
            });
        });
        go.addEventListener('click', function () {
            var sel = document.querySelector('.opt[aria-pressed="true"]');
            if (sel) { lbl.textContent = 'Finding clinics…' }
        });
    </script>
</body>

</html>
