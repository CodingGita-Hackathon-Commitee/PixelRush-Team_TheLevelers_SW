<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PawPal Clinic Ready</title>
    <style>
        :root {
            --bg: #f6f6f5;
            --card: #fff;
            --ink: #16202a;
            --muted: #8d9299;
            --line: #ececec;
            --teal: #2d7f79;
            --deep: #1e4f4a;
            --ok: #43b04a;
            --later: #d9dadd;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #121418;
                --card: #1c1f26;
                --ink: #f1f1f5;
                --muted: #8d90a0;
                --line: #2c303a;
                --later: #3a3e48
            }
        }

        :root[data-theme="dark"] {
            --bg: #121418;
            --card: #1c1f26;
            --ink: #f1f1f5;
            --muted: #8d90a0;
            --line: #2c303a;
            --later: #3a3e48
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html,
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 0 14px 170px
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 2px 0
        }

        .brand {
            font-weight: 700;
            font-size: 16px
        }

        .live {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--ok);
            animation: ping 2s ease-out infinite
        }

        @keyframes ping {
            0% {
                box-shadow: 0 0 0 0 rgba(67, 176, 74, .55)
            }

            100% {
                box-shadow: 0 0 0 10px rgba(67, 176, 74, 0)
            }
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -.5px;
            margin: 30px 2px 0
        }

        .sub {
            font-size: 13px;
            color: var(--muted);
            margin: 6px 2px 0
        }

        .hero {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #235b55, #1b4540);
            color: #fff;
            border-radius: 18px;
            padding: 18px;
            margin-top: 20px
        }

        .hero::after {
            content: "";
            position: absolute;
            right: -40px;
            top: -40px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .06)
        }

        .hero::before {
            content: "";
            position: absolute;
            right: 20px;
            bottom: -60px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .05)
        }

        .hero>* {
            position: relative;
            z-index: 1
        }

        .tag {
            font-size: 10.5px;
            letter-spacing: 1.4px;
            font-weight: 600;
            opacity: .85
        }

        .hero h2 {
            font-size: 21px;
            font-weight: 800;
            margin-top: 10px
        }

        .hero p {
            font-size: 12px;
            opacity: .7;
            margin-top: 5px
        }

        .hero .foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px
        }

        .acc {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, .18);
            border-radius: 99px;
            padding: 9px 16px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .5px
        }

        .acc svg {
            width: 13px;
            height: 13px;
            stroke-width: 3
        }

        .km {
            font-size: 12px;
            opacity: .85
        }

        .stats {
            display: grid;
            grid-template-columns: 1.1fr 1.3fr .8fr;
            gap: 10px;
            background: var(--card);
            border-radius: 16px;
            padding: 14px 16px;
            margin-top: 14px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .04)
        }

        .stats small {
            display: block;
            font-size: 10px;
            color: var(--muted)
        }

        .stats b {
            display: block;
            font-size: 14px;
            margin-top: 8px
        }

        .stats .eta {
            font-size: 20px;
            font-weight: 800;
            margin-top: 5px;
            white-space: nowrap
        }

        .stats .ready {
            color: var(--ok)
        }

        .map {
            position: relative;
            height: 96px;
            border-radius: 16px;
            margin-top: 14px;
            overflow: hidden;
            background: #e8efe9
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) .map {
                background: #1d2a27
            }
        }

        .map svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%
        }

        .map .you,
        .map .cl {
            position: absolute;
            font-size: 10px;
            font-weight: 700;
            background: var(--card);
            border-radius: 99px;
            padding: 4px 9px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .12)
        }

        .map .you {
            left: 12px;
            bottom: 10px
        }

        .map .cl {
            right: 12px;
            top: 10px;
            color: var(--teal)
        }

        .route {
            stroke-dasharray: 6 7;
            animation: dash 1.2s linear infinite
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -26
            }
        }

        h3 {
            font-size: 17px;
            font-weight: 800;
            margin: 26px 2px 0
        }

        .visit {
            background: var(--card);
            border-radius: 16px;
            margin-top: 12px;
            padding: 4px 14px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .04)
        }

        .st {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 0;
            font-size: 13.5px;
            position: relative
        }

        .st+.st {
            border-top: 1px solid var(--line)
        }

        .dot {
            flex: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--ok)
        }

        .st.next .dot {
            box-shadow: 0 0 0 4px rgba(67, 176, 74, .2)
        }

        .st.later {
            color: var(--later)
        }

        .st.later .dot {
            background: var(--later)
        }

        .st span {
            margin-left: auto;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted)
        }

        .st.done span {
            color: var(--ok);
            font-weight: 600
        }

        .st.later span {
            color: var(--ink)
        }

        .cta {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            bottom: calc(64px + env(safe-area-inset-bottom, 0px));
            padding: 26px 14px 12px;
            background: linear-gradient(transparent, var(--bg) 45%)
        }

        .go {
            width: 100%;
            border: 0;
            font: inherit;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            background: var(--teal);
            border-radius: 99px;
            padding: 17px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(45, 127, 121, .3);
            transition: transform .12s, background .2s
        }

        .go:active {
            transform: scale(.98)
        }

        .go.ok {
            background: var(--ok)
        }

        .go:focus-visible,
        .tab:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 2px
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: var(--card);
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px))
        }

        .tab {
            background: none;
            border: 0;
            font: inherit;
            font-size: 10px;
            font-weight: 500;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 2px 14px;
            cursor: pointer
        }

        .tab.on {
            color: var(--teal);
            font-weight: 700
        }

        svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <div class="top">
            <div class="brand">pawpal</div><span class="live" title="Live"></span>
        </div>

        <h1>A clinic is ready.</h1>
        <p class="sub">Confirm the handoff before you go.</p>

        <section class="hero">
            <div class="tag">PAWCARE 24X7</div>
            <h2>We're ready for Milo.</h2>
            <p>Urgent veterinary care</p>
            <div class="foot">
                <span class="acc"><svg viewBox="0 0 24 24">
                        <path d="M20 6L9 17l-5-5" />
                    </svg>ACCEPTED</span>
                <span class="km">2.1 km</span>
            </div>
        </section>

        <section class="stats" aria-label="Arrival details">
            <div><small>Arrive in</small>
                <div class="eta">~ 8 min</div>
            </div>
            <div><small>Clinic</small><b>PawCare 24×7</b></div>
            <div><small>Status</small><b class="ready">Ready</b></div>
        </section>

        <div class="map" aria-label="Route to clinic">
            <svg viewBox="0 0 400 96" preserveAspectRatio="none" fill="none">
                <path d="M0 70H140M200 0V96M260 40H400M60 0V96M330 0V96" stroke="rgba(120,140,130,.25)"
                    stroke-width="10" />
                <path class="route" d="M40 82C110 82 120 50 200 50S300 28 360 22" stroke="#2d7f79" stroke-width="3"
                    stroke-linecap="round" />
                <circle cx="40" cy="82" r="6" fill="#2d7f79" />
                <circle cx="360" cy="22" r="8" fill="#43b04a" />
            </svg>
            <span class="you">You</span><span class="cl">PawCare 24×7</span>
        </div>

        <h3>Your visit</h3>
        <div class="visit">
            <div class="st done"><i class="dot"></i>Request sent<span>Done</span></div>
            <div class="st done"><i class="dot"></i>Clinic confirmed<span>Done</span></div>
            <div class="st next"><i class="dot"></i>On the way<span>Next</span></div>
            <div class="st later"><i class="dot"></i>Checked in<span>Later</span></div>
        </div>
    </main>

    <div class="cta"><button class="go" id="go">Confirm clinic</button></div>

    <nav aria-label="Main">
        <button class="tab"><svg viewBox="0 0 24 24">
                <path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" />
            </svg>Home</button>
        <button class="tab"><svg viewBox="0 0 24 24">
                <path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z" />
            </svg>Care</button>
        <button class="tab on"><svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path d="M16 2v4M8 2v4M3 10h18M8 15l2.5 2.5L16 13" />
            </svg>Visits</button>
        <button class="tab"><svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
            </svg>Profile</button>
    </nav>

    <script>
        var go = document.getElementById('go');
        go.addEventListener('click', function () {
            go.textContent = 'Clinic confirmed ✓'; go.classList.add('ok');
            var n = document.querySelector('.st.next'), l = document.querySelector('.st.later');
            n.className = 'st done'; n.querySelector('span').textContent = 'Done';
            l.className = 'st next'; l.querySelector('span').textContent = 'Next';
        });
    </script>
</body>

</html>
